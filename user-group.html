<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户群 | AIAIY</title>
    <meta name="description" content="加入 AIAIY 用户群，扫码添加微信，获取 AI 工具更新与交流支持。">
    <link rel="canonical" href="https://www.aiaiy.com/user-group.html">
    <style>
        :root {
            --primary: #2563eb;
            --text: #0f172a;
            --muted: #475569;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top right, rgba(37,99,235,0.12), transparent 40%), var(--bg);
        }

        .container {
            width: min(960px, calc(100% - 2rem));
            margin: 0 auto;
        }

        .topbar {
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
        }

        .topbar a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .content {
            padding: 2rem 0 3rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
            align-items: center;
        }

        .qr {
            padding: 1rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 0.9rem;
        }

        .qr img {
            width: 100%;
            display: block;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: 2rem;
        }

        p {
            margin: 0 0 0.8rem;
            color: var(--muted);
            line-height: 1.7;
        }

        .id {
            display: inline-block;
            margin-top: 0.35rem;
            background: #eff6ff;
            color: #1d4ed8;
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .card {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="container">
            <a href="index.html">← 返回首页</a>
        </div>
    </header>

    <main class="content">
        <div class="container">
            <section class="card">
                <div class="qr">
                    <img src="assets/user-group-qr.svg" alt="AIAIY 用户群二维码">
                </div>
                <div>
                    <h1>加入 AIAIY 用户群</h1>
                    <p>欢迎扫码添加微信，备注「用户群」，我会邀请你进入交流社群。群里会分享站内新收录工具、实测心得、实战工作流，以及 AI 应用落地经验。</p>
                    <p><strong>个人介绍：</strong>我是 AIAIY 的站长，长期专注 AI 工具收集、评测和实用场景整理，目标是让每位用户都能更快找到真正好用的 AI 产品。</p>
                    <p>微信号：</p>
                    <div class="id">zhangyouxun2013</div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
