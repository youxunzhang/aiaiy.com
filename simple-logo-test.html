<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单LOGO测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
            min-height: 100px;
        }
        .tool-logo-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.1;
            z-index: 1;
        }
        .card-content {
            position: relative;
            z-index: 2;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>简单LOGO测试</h1>
    
    <div class="status info">
        <strong>测试说明：</strong> 这个页面用于测试LOGO功能是否正常工作
    </div>

    <div class="test-card">
        <div class="card-content">
            <h3>Deepseek</h3>
            <p>Deep Learning Chat Model</p>
        </div>
    </div>

    <div class="test-card">
        <div class="card-content">
            <h3>Google Gemini</h3>
            <p>Latest Google AI Assistant</p>
        </div>
    </div>

    <div class="test-card">
        <div class="card-content">
            <h3>Perplexity</h3>
            <p>AI-powered Search Engine</p>
        </div>
    </div>

    <div id="results"></div>

    <script>
        // 简化的LOGO测试
        class SimpleLogoTest {
            constructor() {
                this.logoMappings = {
                    'deepseek.com': 'https://chat.deepseek.com/favicon.ico',
                    'google.com': 'https://www.google.com/favicon.ico',
                    'perplexity.ai': 'https://www.perplexity.ai/favicon.ico'
                };
            }

            async testLogo(domain, cardIndex) {
                const card = document.querySelectorAll('.test-card')[cardIndex];
                const logoBg = document.createElement('div');
                logoBg.className = 'tool-logo-bg';
                card.insertBefore(logoBg, card.firstChild);

                try {
                    // 尝试获取LOGO
                    const logoUrl = this.logoMappings[domain] || `https://${domain}/favicon.ico`;
                    const response = await fetch(logoUrl);
                    
                    if (response.ok) {
                        const blob = await response.blob();
                        const reader = new FileReader();
                        reader.onload = () => {
                            logoBg.style.backgroundImage = `url(${reader.result})`;
                            console.log(`✅ ${domain} LOGO加载成功`);
                        };
                        reader.readAsDataURL(blob);
                        return true;
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                } catch (error) {
                    console.warn(`❌ ${domain} LOGO加载失败:`, error);
                    // 使用emoji fallback
                    logoBg.style.background = 'linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(147, 51, 234, 0.1))';
                    logoBg.innerHTML = '<div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; opacity: 0.3;">🔍</div>';
                    return false;
                }
            }

            async runTests() {
                const domains = ['deepseek.com', 'google.com', 'perplexity.ai'];
                let successCount = 0;

                for (let i = 0; i < domains.length; i++) {
                    const success = await this.testLogo(domains[i], i);
                    if (success) successCount++;
                }

                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = `
                    <div class="status ${successCount === domains.length ? 'success' : 'error'}">
                        <strong>测试结果：</strong> ${successCount}/${domains.length} 个LOGO加载成功
                    </div>
                `;

                console.log(`🎉 LOGO测试完成：${successCount}/${domains.length} 成功`);
            }
        }

        // 运行测试
        document.addEventListener('DOMContentLoaded', () => {
            const tester = new SimpleLogoTest();
            tester.runTests();
        });
    </script>
</body>
</html>
