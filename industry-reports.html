<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行业报告下载中心 | AIAIY</title>
    <meta name="description" content="AIAIY 行业报告下载中心，汇总 AI 行业研究报告，支持按关键词搜索与下载。">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef4ff 0%, #f8f8ff 40%, #effaf7 100%);
            color: #0f172a;
        }
        .glass {
            background: rgba(255,255,255,.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,.45);
            box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
        }
        .report-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(59, 130, 246, .14);
        }
        .share-menu {
            position: relative;
        }
        .share-panel {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 220px;
            z-index: 60;
        }
    </style>
</head>
<body class="min-h-screen">
    <header class="glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
            <div>
                <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">行业报告下载中心</h1>
                <p class="text-sm text-slate-600">收录 AI 行业研究报告 · 支持关键词筛选与一键下载</p>
            </div>
            <div class="flex items-center gap-2">
                <div class="share-menu">
                    <button id="shareToggle" class="px-3 py-2 rounded-lg border border-blue-200 bg-white/90 text-blue-700 hover:bg-blue-50 text-sm font-semibold">分享页面</button>
                    <div id="sharePanel" class="share-panel glass rounded-xl p-3 hidden">
                        <p class="text-xs text-slate-500 mb-2">分享链接： https://aiaiy.com/</p>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <a class="px-2 py-2 rounded bg-slate-100 hover:bg-slate-200 text-center" target="_blank" rel="noopener noreferrer" data-share="weibo">微博</a>
                            <a class="px-2 py-2 rounded bg-slate-100 hover:bg-slate-200 text-center" target="_blank" rel="noopener noreferrer" data-share="qzone">QQ空间</a>
                            <a class="px-2 py-2 rounded bg-slate-100 hover:bg-slate-200 text-center" target="_blank" rel="noopener noreferrer" data-share="x">X</a>
                            <a class="px-2 py-2 rounded bg-slate-100 hover:bg-slate-200 text-center" target="_blank" rel="noopener noreferrer" data-share="facebook">Facebook</a>
                            <a class="px-2 py-2 rounded bg-slate-100 hover:bg-slate-200 text-center" target="_blank" rel="noopener noreferrer" data-share="linkedin">LinkedIn</a>
                            <a class="px-2 py-2 rounded bg-slate-100 hover:bg-slate-200 text-center" target="_blank" rel="noopener noreferrer" data-share="reddit">Reddit</a>
                        </div>
                        <button id="copyShareLink" class="w-full mt-3 px-3 py-2 rounded bg-blue-600 text-white hover:bg-blue-700 text-xs font-semibold">复制链接</button>
                    </div>
                </div>
                <a href="index.html" class="px-3 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 text-sm font-semibold">返回首页</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <section class="glass rounded-2xl p-5 md:p-7">
            <div class="flex flex-wrap gap-3 items-center justify-between mb-5">
                <div class="text-sm text-slate-600">目录路径：<code class="text-blue-700">assets/industry-reports/</code></div>
                <span id="reportCount" class="text-xs md:text-sm px-3 py-1 rounded-full bg-emerald-100 text-emerald-700"></span>
            </div>

            <div class="mb-6">
                <input id="searchInput" type="search" placeholder="搜索报告名称（例如：教育 / 医疗 / OpenAI）"
                    class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <div id="reportList" class="space-y-3"></div>
        </section>
    </main>

    <script>
        const REPORT_BASE_PATH = 'assets/industry-reports/';
        const REPORT_MANIFEST_PATH = `${REPORT_BASE_PATH}reports.json`;
        let reports = [];

        const defaultReports = [
            { name: '2025年超越瓶颈：人工智能集群组织报告-19页.pdf', file: '2025年超越瓶颈：人工智能集群组织报告-19页.pdf', size: '' },
            { name: '2025年度全球人工智能治理报告-32页.pdf', file: '2025年度全球人工智能治理报告-32页.pdf', size: '' }
        ];

        const reportList = document.getElementById('reportList');
        const reportCount = document.getElementById('reportCount');
        const searchInput = document.getElementById('searchInput');

        function render(keyword = '') {
            const key = keyword.trim().toLowerCase();
            const filtered = reports.filter(item => (item.name || item.file).toLowerCase().includes(key));
            reportCount.textContent = `共 ${filtered.length} / ${reports.length} 份报告`;

            reportList.innerHTML = '';
            filtered.forEach((item, index) => {
                const href = `${REPORT_BASE_PATH}${encodeURIComponent(item.file)}`;
                const el = document.createElement('article');
                el.className = 'report-item transition-all bg-white rounded-xl border border-slate-200 p-4 md:p-5';
                el.innerHTML = `
                    <div class="flex items-start gap-3">
                        <span class="mt-0.5 shrink-0 text-blue-600">📄</span>
                        <div class="min-w-0 flex-1">
                            <h3 class="font-semibold text-slate-900 leading-7 break-words">${index + 1}. ${item.name || item.file}</h3>
                            <div class="mt-2 flex flex-wrap items-center gap-2 text-xs text-slate-500">
                                <span class="px-2 py-1 rounded bg-slate-100">PDF</span>
                                <span class="px-2 py-1 rounded bg-slate-100">${item.size || '待补充大小'}</span>
                            </div>
                        </div>
                        <a href="${href}" download class="shrink-0 inline-flex items-center justify-center rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-2">下载</a>
                    </div>
                `;
                reportList.appendChild(el);
            });
        }

        async function loadReports() {
            try {
                const response = await fetch(REPORT_MANIFEST_PATH, { cache: 'no-store' });
                if (!response.ok) throw new Error(`manifest http ${response.status}`);
                const manifestReports = await response.json();
                if (!Array.isArray(manifestReports)) throw new Error('manifest format invalid');
                reports = manifestReports
                    .filter(item => item?.file)
                    .map(item => ({
                        name: item.name || item.file,
                        file: item.file,
                        size: item.size || ''
                    }));
            } catch (error) {
                console.warn('读取行业报告清单失败，使用默认展示数据。', error);
                reports = defaultReports;
            } finally {
                render(searchInput.value);
            }
        }

        searchInput.addEventListener('input', (e) => render(e.target.value));
        loadReports();

        const shareLink = 'https://aiaiy.com/';
        const shareText = 'AIAIY - AI 资源与导航';
        const shareRoutes = {
            weibo: `https://service.weibo.com/share/share.php?url=${encodeURIComponent(shareLink)}&title=${encodeURIComponent(shareText)}`,
            qzone: `https://sns.qzone.qq.com/cgi-bin/qzshare/cgi_qzshare_onekey?url=${encodeURIComponent(shareLink)}&title=${encodeURIComponent(shareText)}`,
            x: `https://x.com/intent/tweet?url=${encodeURIComponent(shareLink)}&text=${encodeURIComponent(shareText)}`,
            facebook: `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareLink)}`,
            linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareLink)}`,
            reddit: `https://www.reddit.com/submit?url=${encodeURIComponent(shareLink)}&title=${encodeURIComponent(shareText)}`,
        };

        const shareToggle = document.getElementById('shareToggle');
        const sharePanel = document.getElementById('sharePanel');
        const copyShareLink = document.getElementById('copyShareLink');

        document.querySelectorAll('[data-share]').forEach((item) => {
            item.href = shareRoutes[item.dataset.share] || shareLink;
        });

        shareToggle?.addEventListener('click', () => {
            sharePanel?.classList.toggle('hidden');
        });

        document.addEventListener('click', (event) => {
            if (!sharePanel || !shareToggle) return;
            if (!sharePanel.contains(event.target) && !shareToggle.contains(event.target)) {
                sharePanel.classList.add('hidden');
            }
        });

        copyShareLink?.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(shareLink);
                copyShareLink.textContent = '已复制 ✅';
                setTimeout(() => {
                    copyShareLink.textContent = '复制链接';
                }, 1400);
            } catch {
                copyShareLink.textContent = '复制失败，请手动复制';
            }
        });
    </script>
</body>
</html>
