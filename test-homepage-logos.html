<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页LOGO测试页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="modern-styles.css">
    <style>
        .tool-card {
            position: relative;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 1rem;
            padding: 1.5rem;
            margin: 1rem;
            transition: all 0.3s ease;
            overflow: hidden;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .tool-card h3 {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1e293b;
        }
        
        .tool-card p {
            color: #64748b;
            font-size: 0.875rem;
        }
        
        .test-controls {
            background: #f8fafc;
            padding: 1rem;
            margin: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
        }
        
        .test-controls button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            margin: 0.25rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .test-controls button:hover {
            background: #1d4ed8;
        }
        
        .status-info {
            background: #f0f9ff;
            padding: 1rem;
            margin: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #0ea5e9;
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">首页LOGO优化器测试</h1>
        
        <div class="test-controls">
            <h3 class="font-semibold mb-2">测试控制</h3>
            <button onclick="testAddLogos()">添加LOGO</button>
            <button onclick="testClearCache()">清除缓存</button>
            <button onclick="testReloadLogos()">重新加载LOGO</button>
            <button onclick="testExportCache()">导出缓存信息</button>
        </div>
        
        <div class="status-info">
            <h3 class="font-semibold mb-2">状态信息</h3>
            <div id="statusDisplay">等待操作...</div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- 测试工具卡片 -->
            <a href="https://chat.openai.com/" target="_blank" class="tool-card">
                <h3>ChatGPT</h3>
                <p>OpenAI的对话式AI助手</p>
            </a>
            
            <a href="https://gemini.google.com/app" target="_blank" class="tool-card">
                <h3>Google Gemini</h3>
                <p>Google的AI对话助手</p>
            </a>
            
            <a href="https://claude.ai/" target="_blank" class="tool-card">
                <h3>Claude</h3>
                <p>Anthropic的AI助手</p>
            </a>
            
            <a href="https://www.perplexity.ai/" target="_blank" class="tool-card">
                <h3>Perplexity</h3>
                <p>AI驱动的搜索引擎</p>
            </a>
            
            <a href="https://github.com/" target="_blank" class="tool-card">
                <h3>GitHub</h3>
                <p>代码托管平台</p>
            </a>
            
            <a href="https://vercel.com/" target="_blank" class="tool-card">
                <h3>Vercel</h3>
                <p>前端部署平台</p>
            </a>
        </div>
    </div>

    <!-- 引入首页LOGO优化器 -->
    <script src="homepage-logo-optimizer.js"></script>
    
    <script>
        function testAddLogos() {
            document.getElementById('statusDisplay').innerHTML = '正在添加LOGO...';
            window.homepageLogoOptimizer.addLogosToAllCards().then(() => {
                document.getElementById('statusDisplay').innerHTML = 'LOGO添加完成！';
            });
        }
        
        function testClearCache() {
            window.homepageLogoOptimizer.clearCache();
            document.getElementById('statusDisplay').innerHTML = '缓存已清除';
        }
        
        function testReloadLogos() {
            document.getElementById('statusDisplay').innerHTML = '正在重新加载LOGO...';
            window.homepageLogoOptimizer.reloadAllLogos().then(() => {
                document.getElementById('statusDisplay').innerHTML = 'LOGO重新加载完成！';
            });
        }
        
        function testExportCache() {
            const cacheInfo = window.homepageLogoOptimizer.exportCacheInfo();
            document.getElementById('statusDisplay').innerHTML = `
                <strong>缓存信息:</strong><br>
                缓存域名数量: ${cacheInfo.totalCached}<br>
                已处理卡片数量: ${cacheInfo.processedCards}<br>
                缓存域名: ${cacheInfo.cachedDomains.join(', ')}
            `;
        }
        
        // 页面加载完成后自动测试
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                testAddLogos();
            }, 2000);
        });
    </script>
</body>
</html>
